<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Soundforge settings</title>
  <style>
    body { color: #f2f2f2; background: #202228; font: 14px Segoe UI, sans-serif; margin: 14px; }
    label { display: block; font-weight: 600; margin: 0 0 6px; }
    select { box-sizing: border-box; width: 100%; color: #17181c; padding: 8px; }
    p { color: #c8cbd3; line-height: 1.4; }
    #settings { display: none; }
  </style>
</head>
<body>
  <div id="scene-settings" class="settings">
    <label for="sceneName">Scene name</label>
    <select id="sceneName"><option value="">Open Soundforge to load scenes…</option></select>
    <p>The list comes from the project currently open in Soundforge.</p>
  </div>
  <div id="music-pool-settings" class="settings">
    <label for="poolSceneName">Scene</label>
    <select id="poolSceneName"><option value="">Open Soundforge to load scenes…</option></select>
    <label for="poolName" style="margin-top: 14px;">Music pool</label>
    <select id="poolName"><option value="">Select a scene first…</option></select>
    <p>Choose a scene, then one of its Music pools. Activating it also follows any linked Ambience pools.</p>
  </div>
  <div id="effect-settings" class="settings">
    <label for="trackName">Effect source name</label>
    <select id="trackName"><option value="">Activate a scene to load effects…</option></select>
    <p>The list comes from the active scene’s Effects layer.</p>
  </div>
  <p id="no-settings">This action needs no setup.</p>
  <script>
    let socket, context, action, settings = {};
    const scene = document.getElementById('scene-settings');
    const musicPool = document.getElementById('music-pool-settings');
    const effect = document.getElementById('effect-settings');
    const none = document.getElementById('no-settings');
    const sceneInput = document.getElementById('sceneName');
    const poolSceneInput = document.getElementById('poolSceneName');
    const poolInput = document.getElementById('poolName');
    const trackInput = document.getElementById('trackName');

    window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
      const details = JSON.parse(actionInfo);
      context = uuid;
      action = details.action;
      settings = details.payload && details.payload.settings ? details.payload.settings : {};
      scene.style.display = action.endsWith('.scene') ? 'block' : 'none';
      musicPool.style.display = action.endsWith('.music-pool') ? 'block' : 'none';
      effect.style.display = action.endsWith('.effect') ? 'block' : 'none';
      none.style.display = scene.style.display === 'none' && musicPool.style.display === 'none' && effect.style.display === 'none' ? 'block' : 'none';
      socket = new WebSocket(`ws://127.0.0.1:${port}`);
      socket.onopen = () => {
        socket.send(JSON.stringify({ event: registerEvent, uuid }));
        window.setTimeout(loadChoices, 150);
      };
      socket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.event === 'didReceiveSettings') {
          settings = message.payload.settings || {};
          selectValue(sceneInput, settings.sceneName || '');
          selectValue(poolSceneInput, settings.sceneName || '');
          selectValue(poolInput, settings.poolName || '');
          selectValue(trackInput, settings.trackName || '');
        }
        if (message.event === 'sendToPropertyInspector') {
          if (message.payload.type === 'getScenes') {
            const target = action.endsWith('.music-pool') ? poolSceneInput : sceneInput;
            populate(target, message.payload.values || [], 'No scenes found');
            if (action.endsWith('.music-pool')) requestMusicPools();
          }
          if (message.payload.type === 'getMusicPools') populate(poolInput, message.payload.values || [], 'No Music pools found');
          if (message.payload.type === 'getEffects') populate(trackInput, message.payload.values || [], 'No effects in active scene');
          if (message.payload.type === 'savedSettings') {
            settings = {
              sceneName: message.payload.sceneName || '',
              trackName: message.payload.trackName || '',
              poolName: message.payload.poolName || ''
            };
            selectValue(sceneInput, settings.sceneName);
            selectValue(poolSceneInput, settings.sceneName);
            selectValue(poolInput, settings.poolName);
            selectValue(trackInput, settings.trackName);
            if (action.endsWith('.music-pool')) requestMusicPools();
          }
        }
      };
    };

    function loadChoices() {
      if (!socket || socket.readyState !== WebSocket.OPEN || !action) return;
      const command = action.endsWith('.scene') || action.endsWith('.music-pool')
        ? 'getScenes'
        : action.endsWith('.effect') ? 'getEffects' : null;
      if (command) socket.send(JSON.stringify({ event: 'sendToPlugin', action, context, payload: { command } }));
    }

    function requestMusicPools() {
      if (!socket || socket.readyState !== WebSocket.OPEN || !action || !action.endsWith('.music-pool')) return;
      const sceneName = poolSceneInput.value.trim();
      if (!sceneName) {
        populate(poolInput, [], 'Select a scene first…');
        return;
      }
      socket.send(JSON.stringify({
        event: 'sendToPlugin',
        action,
        context,
        payload: { command: 'getMusicPools', sceneName }
      }));
    }

    function populate(select, values, placeholder) {
      const chosen = select === sceneInput || select === poolSceneInput
        ? (settings.sceneName || '')
        : select === poolInput ? (settings.poolName || '') : (settings.trackName || '');
      select.innerHTML = '';
      const empty = document.createElement('option');
      empty.value = '';
      empty.textContent = placeholder;
      select.appendChild(empty);
      values.forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      selectValue(select, chosen);
    }

    function selectValue(select, value) {
      if ([...select.options].some(option => option.value === value)) select.value = value;
    }

    function save() {
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      settings = action && action.endsWith('.music-pool')
        ? { sceneName: poolSceneInput.value.trim(), trackName: '', poolName: poolInput.value.trim() }
        : { sceneName: sceneInput.value.trim(), trackName: trackInput.value.trim(), poolName: '' };
      socket.send(JSON.stringify({
        event: 'sendToPlugin',
        action,
        context,
        payload: { command: 'saveSettings', ...settings }
      }));
    }
    sceneInput.addEventListener('change', save);
    poolSceneInput.addEventListener('change', () => {
      settings.sceneName = poolSceneInput.value.trim();
      settings.poolName = '';
      save();
      requestMusicPools();
    });
    poolInput.addEventListener('change', save);
    trackInput.addEventListener('change', save);
  </script>
</body>
</html>
